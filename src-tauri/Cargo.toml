[package]
name = "exact-canvas"
version = "1.0.0"
description = "Exact Canvas — kanvas sketsa Wacom, local-first"
authors = ["Exact Group"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "exact_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["macos-private-api", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-window-state = "2.4.1"
# Server berbagi di jaringan: TV dan tablet membuka kanvas lewat browser.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
base64 = "0.22"
# Akun murid: PBKDF2-HMAC-SHA256 dan garam/token acak.
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
